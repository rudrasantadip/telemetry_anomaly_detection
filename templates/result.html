<!doctype html><html><head><meta charset="utf-8"><title>Prediction</title><style>body{font-family:Arial;max-width:800px;margin:60px auto}.box{padding:35px;border-radius:18px;background:#f5f6f8;text-align:center}.danger{background:#ffe8e8}.ok{background:#e8f8ed}.big{font-size:40px;font-weight:bold}a{display:inline-block;margin-top:20px}</style></head><body><div class="box {% if result and result.prediction==1 %}danger{% else %}ok{% endif %}">{% if error %}<h2>Error</h2><p>{{error}}</p>{% else %}<div class="big">{% if result.prediction==1 %}ANOMALY{% else %}NOMINAL{% endif %}</div><p>Anomaly probability: <b>{{'%.2f'|format(result.anomaly_probability*100)}}%</b></p>{% endif %}<a href="/">Back</a></div></body></html>
